name: CI Build

# 同时监听 main 和 master 分支的推送和 PR
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # 允许你在页面上点击按钮手动触发构建

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive # 如果项目包含子模块，自动递归拉取

      # 2. 安装编译所需的依赖（针对 Linux 环境下的 CMake 编译）
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libx11-dev libxext-dev libgl1-mesa-dev

      # 3. 创建编译文件夹并配置项目（合为一个路径创建并进入）
      - name: Configure CMake
        run: |
          mkdir -p build && cd build
          cmake ..

      # 4. 执行编译
      - name: Build Project
        run: |
          cd build
          make -j$(nproc)

      # 5. 收集并将构建产物打包（生成可以直接下载的链接）
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RNW-Renderer-Build # 下载时的压缩包名称
          path: build/             # 需要上传的构建产物文件夹路径
          retention-days: 7        # 产物保留天数（最多90天）
