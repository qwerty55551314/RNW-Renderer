name: Android Auto Build (arm64-v8a)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取项目源码（包含子模块）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 强制同步和更新子模块（解决 3rdparty/SPIRV-Cross 缺失问题）
      - name: Sync and Update Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # 3. 配置 Android NDK 环境
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      # 4. 重点：创建文件夹合为一个路径，并配置 CMake
      - name: Configure CMake
        run: |
          mkdir -p build_arm64-v8a && cd build_arm64-v8a && cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      # 5. 执行编译
      - name: Build
        run: |
          cd build_arm64-v8a && make -j$(nproc)

      # 6. 重点：收集并上传可直接下载的产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RNW-Renderer-arm64-v8a
          path: |
            build_arm64-v8a/**/*.so
            build_arm64-v8a/**/*.a
          retention-days: 7