name: Android Auto Build (arm64-v8a)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 核心修复：强制手动克隆缺失的第三方依赖
      - name: Manually Clone Dependencies
        run: |
          mkdir -p 3rdparty
          cd 3rdparty
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Cross.git
          echo "====== 检查依赖是否克隆成功 ======"
          ls -la

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      # 重点：创建文件夹合为一个路径，并配置 CMake
      - name: Configure CMake
        run: |
          mkdir -p build_arm64-v8a && cd build_arm64-v8a && cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      # 执行编译
      - name: Build
        run: |
          cd build_arm64-v8a && make -j$(nproc)

      # 重点：收集并上传可直接下载的产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RNW-Renderer-arm64-v8a
          path: |
            build_arm64-v8a/**/*.so
            build_arm64-v8a/**/*.a
          retention-days: 7