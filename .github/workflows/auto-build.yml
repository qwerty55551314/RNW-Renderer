name: Android Auto Build (arm64-v8a)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 核心修复：强制使用 HTTPS 拉取子模块，并打印目录内容
      - name: Sync and Update Submodules
        run: |
          cat .gitmodules || echo "没有 .gitmodules 文件"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --recursive --force
          echo "====== 检查 3rdparty 目录 ======"
          ls -la 3rdparty/ || echo "3rdparty 目录不存在"
          ls -la 3rdparty/glslang/ || echo "glslang 缺失"
          ls -la 3rdparty/SPIRV-Cross/ || echo "SPIRV-Cross 缺失"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      # 重点：创建文件夹合为一个路径，并配置 CMake
      - name: Configure CMake
        run: |
          mkdir -p build_arm64-v8a && cd build_arm64-v8a && cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      # 执行编译
      - name: Build
        run: |
          cd build_arm64-v8a && make -j$(nproc)

      # 重点：收集并上传可直接下载的产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RNW-Renderer-arm64-v8a
          path: |
            build_arm64-v8a/**/*.so
            build_arm64-v8a/**/*.a
          retention-days: 7