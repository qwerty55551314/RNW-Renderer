name: Android Auto Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.android_abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        android_abi: [arm64-v8a, armeabi-v7a, x86_64, x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: |
          mkdir -p build_${{ matrix.android_abi }}
          cd build_${{ matrix.android_abi }}
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build_${{ matrix.android_abi }}
          make -j$(nproc)

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RNW-Renderer-${{ matrix.android_abi }}
          path: |
            build_${{ matrix.android_abi }}/**/*.so
            build_${{ matrix.android_abi }}/**/*.a
          retention-days: 7